version: "1.0.0"
description: Board Support Package (BSP) for Waveshare ESP32-S3-AUDIO-Board
url: https://github.com/r1ckp0/Waveshare-ESP32-components/tree/master/bsp/waveshare_esp32_s3_audio

targets:
  - esp32s3

tags:
  - bsp

dependencies:
  idf: ">=5.4"

  espressif/esp_codec_dev:
    version: "*"
    public: true


  espressif/esp_lvgl_port:
    version: "^2"
    public: true


  espressif/esp_lcd_ili9341:
    version: "*"
    public: false

  espressif/esp_lcd_touch_gt911:
    version: "*"
    public: false

  espressif/esp_lcd_touch_tt21100:
    version: "*"
    public: false

  espressif/esp_video:
    version: "^2.0"
    public: true

  espressif/button:
    version: "^4"
    public: true

  espressif/led_indicator:
    version: "^2"
    public: true

  espressif/led_strip:
    version: "*"
    public: true

